<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Best of 99</title>
<meta name="description" content="Live-Stand, Bans, Decks und jedes Spiel einer Clash Royale Best-of-99-Serie.">
<meta name="theme-color" content="#0b0c0f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%225%22 fill=%22%230b0c0f%22/%3E%3Crect x=%226%22 y=%2214%22 width=%229%22 height=%224%22 fill=%22%234b9bff%22/%3E%3Crect x=%2217%22 y=%2214%22 width=%229%22 height=%224%22 fill=%22%23ff5468%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" crossorigin="anonymous">
<link rel="preload" href="fonts/clash-bold.otf" as="font" type="font/otf" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js" defer></script>
<style>
/* Supercell's Clash face for names and numbers only; running text stays Inter. */
@font-face { font-family: Clash; src: url(fonts/clash-bold.otf) format('opentype'); font-weight: 700; font-display: swap; }
@font-face { font-family: Clash; src: url(fonts/clash-heavy.otf) format('opentype'); font-weight: 900; font-display: swap; }
/* Match-center layout after HLTV / VLR / Sofascore: a score header, tabs, then
   dense, square-edged panels with section rules instead of floating cards. */
:root {
  /* Clash Royale's own convention: your side blue, the opponent red. Neutral graphite around it. */
  --bg: #0b0c0f; --panel: #121418; --row: #191c21; --rowhi: #20242b; --line: #23272e; --line2: #2f343d;
  --text: #ecedf0; --mute: #8d929c; --dim: #5b606a;
  --a: #4b9bff; --b: #ff5468;
  --live: #ff3b3b; --ban: #9aa0aa;
  --cond: Clash, 'Arial Rounded MT Bold', system-ui, sans-serif;
  --body: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 400 14px/1.45 var(--body); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 48px; }
.ca { color: var(--a); } .cb { color: var(--b); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.crumbs { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; font-size: 12px; color: var(--mute); padding: 4px 0 12px; }
.crumbs a { text-decoration: none; color: var(--mute); }
.crumbs a:hover { color: var(--text); }
.crumbs .right { display: inline-flex; align-items: center; gap: 14px; }
.lang { display: inline-flex; border: 1px solid var(--line2); border-radius: 4px; overflow: hidden; }
.lang button { appearance: none; background: none; border: 0; color: var(--dim); font: 600 11px var(--body); padding: 3px 8px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--row); color: var(--text); }
.live { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--live); letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
.live.final { color: var(--mute); } .live.final i { background: var(--mute); animation: none; }
.live .ago { font-weight: 500; color: var(--dim); text-transform: none; letter-spacing: 0; }
@keyframes pulse { 50% { opacity: .35; } }

.head { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 22px 20px 16px; }
.team { min-width: 0; }
.team .nm { font: 700 clamp(18px, 3.6vw, 30px)/1.05 var(--cond); }
.team .tag { font-size: 12px; color: var(--dim); margin-top: 4px; }
.team.b { text-align: right; }
.mid { text-align: center; }
.mid .sc { font: 900 clamp(38px, 7.5vw, 60px)/1 var(--cond); white-space: nowrap; }
.mid .sc span { padding: 0 .12em; color: var(--dim); }
.match .sub { grid-column: 1 / -1; text-align: center; font-size: 12px; color: var(--mute); margin-top: -4px; }
.race { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 20px 16px; }
.track { position: relative; height: 6px; background: var(--line); }
.track div { position: absolute; top: 0; bottom: 0; transition: width .6s ease; }
.track.a div { left: 0; background: var(--a); } .track.b div { right: 0; background: var(--b); }
.race small { display: block; font-size: 11px; color: var(--dim); margin-top: 6px; }
.race .rb small { text-align: right; }
.meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--mute); }
.meta b { color: var(--text); font-weight: 600; }

.tabs { display: flex; border-bottom: 1px solid var(--line); margin: 18px 0 16px; overflow-x: auto; }
.tabs button { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--mute); font: 600 14px var(--body); padding: 10px 16px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
.tabs button:hover { color: var(--text); }

.cols { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 920px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.panel > h2 { margin: 0; padding: 12px 16px; font: 700 13px var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--mute); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.panel > h2 span { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--dim); }

/* series timeline: one column per game, a row per player (VLR round history) */
.tl-scroll { overflow-x: auto; padding: 14px 16px 6px 0; }
.tl { display: grid; grid-template-columns: 80px 1fr; row-gap: 3px; min-width: calc(80px + var(--n) * 13px); }
.tl .who { font: 700 11px var(--cond); align-self: stretch; display: flex; align-items: center; position: sticky; left: 0; z-index: 1; background: var(--panel); padding: 0 8px 0 16px; }
.tl .pin { position: sticky; left: 0; z-index: 1; background: var(--panel); }
.tl .row { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; }
.tl .row i { height: 16px; background: var(--row); display: block; }
.tl .row i.w.a { background: var(--a); } .tl .row i.w.b { background: var(--b); }
.tl .row i.w.big { box-shadow: inset 0 0 0 2px rgba(0,0,0,.45); }
.tl .row i.cut { margin-left: 4px; }
.tl .lead { height: 70px; margin-bottom: 6px; }
.tl .lead svg { display: block; width: 100%; height: 100%; }
.tl .nums { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; font-size: 9px; color: var(--dim); text-align: center; margin-top: 2px; }
.tl-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 4px 16px 14px; font-size: 12px; color: var(--mute); }
.tl-legend b { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; margin-right: 5px; }

.veto { list-style: none; margin: 0; padding: 4px 0; }
.veto li { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.veto li:last-child { border-bottom: 0; }
.veto .rng { font: 700 12px var(--cond); color: var(--mute); white-space: nowrap; }
.veto .rng.now { color: var(--text); }
.veto .who { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.veto .ban { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); min-width: 0; }
.veto .ban img { width: 22px; height: 27px; object-fit: contain; flex: none; filter: grayscale(.5); }
.veto .ban b { color: var(--text); font-weight: 600; }
.veto .rec { font: 700 15px var(--cond); white-space: nowrap; text-align: right; }
.veto .rec small { display: block; font: 400 11px var(--body); color: var(--dim); }
.x { position: relative; display: inline-block; }
.x::after { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; height: 2px; background: var(--ban); transform: rotate(-35deg); }
.banedit { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.banedit input { width: 160px; max-width: 100%; font: 500 13px var(--body); color: var(--text); background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 8px; }
.banedit button, .btn { font: 600 13px var(--body); color: var(--text); background: var(--row); border: 1px solid var(--line2); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
.btn[aria-pressed="true"] { border-color: var(--mute); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.banedit button:disabled, .btn:disabled { opacity: .45; cursor: default; }
.banedit .err { color: var(--live); font-size: 12px; }
.foot { padding: 10px 16px; font-size: 12px; color: var(--dim); border-top: 1px solid var(--line); }

.cmp { list-style: none; margin: 0; padding: 6px 0; }
.cmp li { padding: 9px 16px; }
.cmp .l { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; font-size: 13px; }
.cmp .l span:nth-child(2) { color: var(--mute); text-align: center; }
.cmp .l span:last-child { text-align: right; }
.cmp .l b { font-weight: 700; }
.cmp .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
.cmp .bars div { height: 4px; background: var(--line); position: relative; }
.cmp .bars div i { position: absolute; top: 0; bottom: 0; }
.cmp .bars div:first-child i { right: 0; background: var(--a); }
.cmp .bars div:last-child i { left: 0; background: var(--b); }
.cmp .bars .lo i { opacity: .45; }

.feed { display: flex; flex-direction: column; }
.game { display: grid; grid-template-columns: 52px minmax(0, 1fr) 76px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.game:last-child { border-bottom: 0; }
.game .no { font: 700 15px/1 var(--cond); color: var(--mute); }
.game .no small { display: block; font: 400 11px var(--body); color: var(--dim); margin-top: 3px; }
.deck8 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; max-width: 460px; }
.game .da { justify-self: end; width: 100%; }
.deck8 img { width: 100%; aspect-ratio: 5 / 6; object-fit: contain; display: block; }
.game .lose { opacity: .4; }
.game .res { text-align: center; }
.game .res .s { font: 900 21px/1 var(--cond); }
.game .res .s .w.a { color: var(--a); } .game .res .s .w.b { color: var(--b); }
.game .res .s span:not(.w) { color: var(--mute); }
.game .tags { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: -2px; }
.tagx { font-size: 11px; color: var(--mute); background: var(--row); border: 1px solid var(--line2); border-radius: 3px; padding: 1px 6px; }
.tagx.hot { color: var(--text); border-color: var(--dim); }
.game.fresh { animation: fresh 3s ease-out; }
@keyframes fresh { from { background: var(--rowhi); } to { background: transparent; } }
.phasebar { padding: 7px 16px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--mute); background: var(--row); border-bottom: 1px solid var(--line); }
@media (max-width: 640px) {
  .game { grid-template-columns: 1fr auto; gap: 8px 10px; }
  .game .no { grid-column: 1; display: flex; gap: 8px; align-items: baseline; }
  .game .no small { margin: 0; }
  .game .res { grid-column: 2; grid-row: 1; }
  .game .da, .game .db { grid-column: 1 / -1; max-width: none; }
  .game .da::before, .game .db::before { content: attr(data-who); grid-column: 1 / -1; font: 700 11px var(--body); color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .game .tags { grid-column: 1 / -1; margin: 0; }
}

.dtable { width: 100%; border-collapse: collapse; }
.dtable th { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .05em; color: var(--dim); text-align: right; padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.dtable th:first-child { text-align: left; }
.dtable td { padding: 10px 16px; border-bottom: 1px solid var(--line); text-align: right; font-size: 14px; white-space: nowrap; vertical-align: middle; }
.dtable td:first-child { width: 100%; white-space: normal; }
.dtable tr:last-child td { border-bottom: 0; }
.dtable .deck8 { max-width: 360px; }
.dtable .na { color: var(--dim); }
.tablewrap { overflow-x: auto; }
.more { display: block; width: calc(100% - 32px); margin: 10px 16px 14px; text-align: center; }

/* recap: a fixed-size artboard, scaled down for the preview, exported 1:1 as PNG */
.rc-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.rc-tools .hint { font-size: 12px; color: var(--dim); margin-left: auto; }
.rc-stage { padding: 16px; }
.rc-fit { position: relative; overflow: hidden; margin: 0 auto; border: 1px solid var(--line); }
.rc-fit > .art { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.art { background: #0b0c0f; color: #ecedf0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; font-feature-settings: "tnum" 1; }
.art .r-top { display: flex; justify-content: space-between; font: 600 22px Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8d929c; }
.art .r-top b { color: #ecedf0; font-weight: 700; }
.art .r-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 40px; }
.art .r-name { font: 700 76px/1 Clash, sans-serif; }
.art .r-name.b { text-align: right; }
.art .r-num { font: 900 190px/0.95 Clash, sans-serif; white-space: nowrap; }
.art .r-num span { color: #3a404b; padding: 0 .08em; }
.art .r-verdict { text-align: center; font: 600 28px Inter, sans-serif; color: #8d929c; }
.art .r-verdict b { font-weight: 700; }
.art .r-label { font: 700 18px Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #5b606a; margin-bottom: 14px; }
.art .r-tl .row { display: grid; gap: 3px; }
.art .r-tl .row i { display: block; background: #191c21; }
.art .r-tl .row i.a { background: #4b9bff; } .art .r-tl .row i.b { background: #ff5468; }
.art .r-tl .row i.cut { margin-left: 8px; }
.art .r-tl .who { font: 700 22px Clash, sans-serif; }
.art .r-cols { display: grid; gap: 36px; }
.art .r-ban { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 12px 0; border-bottom: 2px solid #23272e; }
.art .r-ban:last-child { border-bottom: 0; }
.art .r-ban .rng { font: 700 22px Clash, sans-serif; color: #8d929c; white-space: nowrap; }
.art .r-ban .cards { display: flex; gap: 10px; }
.art .r-ban .cards img { width: 48px; height: 58px; object-fit: contain; }
.art .r-ban .cards .none { font: 500 20px Inter, sans-serif; color: #5b606a; align-self: center; }
.art .r-ban .rec { font: 700 30px Clash, sans-serif; white-space: nowrap; }
.art .r-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.art .r-stat { background: #121418; border: 2px solid #23272e; border-radius: 8px; padding: 18px 22px; }
.art .r-stat .v { font: 900 56px/1 Clash, sans-serif; }
.art .r-stat .v small { font-size: 26px; color: #8d929c; margin-left: 6px; }
.art .r-stat .k { font: 500 20px Inter, sans-serif; color: #8d929c; margin-top: 8px; }
.art .r-deck { margin-bottom: 18px; }
.art .r-deck .who { display: flex; justify-content: space-between; font: 700 24px Clash, sans-serif; margin-bottom: 8px; }
.art .r-deck .who span { font: 600 20px Inter, sans-serif; color: #8d929c; }
.art .r-deck .cards { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.art .r-deck .cards img { width: 100%; aspect-ratio: 5 / 6; object-fit: contain; display: block; }
.art.social .r-top { font-size: 18px; }
.art.social .r-deck { margin-bottom: 10px; }
.art.social .r-deck .cards { gap: 10px; }
.art.social .r-deck { margin-bottom: 18px; }
.art.social .r-stat { padding: 14px 18px; }
.art.social .r-stat .v { font-size: 46px; }
.art.social .r-stat .k { font-size: 18px; }
.art.social .r-ban { padding: 8px 0; }
.art .r-foot { display: flex; justify-content: space-between; font: 500 18px Inter, sans-serif; color: #5b606a; margin-top: auto; }

.list a { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); text-decoration: none; }
.list a:last-child { border-bottom: 0; }
.list a:hover { background: var(--row); }
.list .t { font: 700 18px var(--cond); }
.list small { font-size: 12px; color: var(--mute); }
.empty { color: var(--mute); padding: 18px 16px; margin: 0; }
footer { font-size: 12px; color: var(--dim); text-align: center; margin-top: 22px; }
@media (max-width: 520px) {
  .match { padding: 18px 14px 14px; gap: 8px; }
  .race, .meta { padding-left: 14px; padding-right: 14px; }
  .team .tag { display: none; }
  .veto li { grid-template-columns: 82px 1fr auto; gap: 10px; padding: 10px 14px; }
  .rc-tools .hint { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .live i, .game.fresh { animation: none; } .track div { transition: none; } }
</style>
</head>

<main class="wrap" id="app"><p class="empty">…</p></main>
<datalist id="bo99-cards"></datalist>
<script src="cards.js"></script>
<script>
const FN = 'https://rudopohqygznwhudyohf.supabase.co/functions/v1/bo99';
const ASSETS = 'https://cdns3.royaleapi.com/static/img/cards/v9-f09d5c9d/';
const KING_HP = 4824, PRINCESS_HP = 3052, REFRESH_MS = 20000;
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const slug = params.get('s');

// ---------- language: German by default, English on request ----------
const STR = {
  de: {
    allSeries: 'Alle Serien', showmatch: 'Showmatch', live: 'Live', final: 'Beendet',
    justNow: 'gerade aktualisiert', ago: (s) => `vor ${s} s aktualisiert`,
    sub: (bo, t) => `Best of ${bo} · wer zuerst ${t} Siege hat`, next: (n) => `als Nächstes Spiel ${n}`,

    level: 'Gleichstand', leads: (who, n) => `${who} führt mit ${n}`, winsSeries: (who) => `${who} gewinnt die Serie`,

    timeline: 'Serienverlauf', perGame: 'eine Spalte pro Spiel',
    legendLine: 'Linie: Abstand nach jedem Spiel', win: (who) => `Sieg ${who}`, legendThree: 'Dunkler Rahmen: drei Kronen', legendGap: 'Lücke: neue Bans',
    bans: 'Bans', bansSub: (n) => `alle ${n} Spiele, gelten für beide`, games: (a, b) => `Spiele ${a}–${b}`,

    played: (n) => `${n} gespielt`, upNext: 'als Nächstes',
    modHint: 'Mod-Modus: Karte eingeben und speichern. Feld leeren und speichern entfernt den Ban.',
    save: 'Speichern', saving: 'Speichert', pickCard: 'Karte aus der Liste wählen', badLink: 'Mod-Link nicht mehr gültig', saveFail: 'Speichern fehlgeschlagen, bitte erneut',
    cardPh: 'Karte', bannedBy: (who) => `Von ${who} gebannte Karte`,
    h2h: 'Direktvergleich',
    stats: { wins: 'Siege', three: 'Drei-Kronen-Siege', oneNil: 'Siege mit einer Krone', best: 'Längste Siegesserie', damage: 'Turmschaden pro Spiel', leaked: 'Verschwendetes Elixier pro Spiel', decks: 'Verschiedene Decks', closest: 'Knappster Sieg, niedrigster Turm' },
    leadChanges: (n) => `Die Führung wechselte ${n}-mal.`,
    latest: 'Letzte Spiele', newest: 'neueste zuerst', allGames: 'Alle Spiele', everyGame: 'Alle Spiele', all: 'Alle',
    tagThree: 'Drei Kronen', tagHp: (hp) => `Sieg mit ${hp} HP`, tagMirror: 'Spiegelduell',
    phase: (a, b) => `Spiele ${a}–${b}`, phaseBans: (list) => `Bans: ${list}`, phaseNone: 'noch keine Bans eingetragen',
    firstGame: 'Das erste Spiel erscheint hier etwa eine Minute nach Spielende.',

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const num = (v, d = 0) => Number(v).toLocaleString(LOCALE(), { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (a, b) => (a + b ? Math.round((a / (a + b)) * 100) : 0);
const langSwitch = () => `<span class="lang" role="group" aria-label="Language">${['de', 'en'].map((l) => `<button type="button" data-lang="${l}" aria-pressed="${lang === l}">${l.toUpperCase()}</button>`).join('')}</span>`;

async function call(body) {
  const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { status: res.status });
  return data;
}

const SUFFIX = ['', '-ev1', '-hero'];
const keyOf = (name) => (window.BO99_CARDS || {})[name];
function cardImg(name, level) {
  const key = keyOf(name);
  const urls = [...new Set([ICONS[`${name}|${level}`], key && ASSETS + key + SUFFIX[Math.min(level, 2)] + '.png', ICONS[`${name}|0`], key && ASSETS + key + '.png'].filter(Boolean))];
  return `<img src="${esc(urls[0] || '')}" data-next="${esc(urls.slice(1).join(' '))}" alt="${esc(name)}" title="${esc(name)}" loading="lazy" onerror="nextImg(this)">`;
}
/** Exportable card image: the same art, fetched through the bo99 function so the canvas stays clean. */
const viaProxy = (u) => `${FN}?img=${encodeURIComponent(u)}`;
function corsImg(name, level) {
  const key = keyOf(name);
  const urls = [...new Set([ICONS[`${name}|${level}`], key && ASSETS + key + SUFFIX[Math.min(level, 2)] + '.png', ICONS[`${name}|0`], key && ASSETS + key + '.png'].filter(Boolean))].map(viaProxy);
  if (!urls.length) return '<span></span>';

}
window.nextImg = (img) => {
  const rest = (img.dataset.next || '').split(' ').filter(Boolean);
  if (!rest.length) { img.onerror = null; img.style.visibility = 'hidden'; return; }
  img.dataset.next = rest.slice(1).join(' ');
  img.src = rest[0];
};
const deck8 = (cards, cls = '', who = '') => `<div class="deck8 ${cls}" data-who="${esc(who)}">${cards.map(([n, l]) => cardImg(n, l)).join('')}</div>`;

// ---------- numbers ----------
const deckKey = (cards) => cards.map((c) => c[0]).sort().join('|');
function lowestStanding(s) {
  const t = [...(s.princess || []), ...(s.king !== null && s.king < KING_HP ? [s.king] : [])].filter((v) => v > 0);
  return t.length ? Math.min(...t) : null;
}
const damageTo = (s) => (KING_HP - (s.king ?? KING_HP)) + (s.princess || []).reduce((t, p) => t + (PRINCESS_HP - p), 0) + PRINCESS_HP * (2 - (s.princess || []).length);

function analyse(p) {
  const games = p.games.map((g, i) => {
    const w = g.host.crowns > g.opp.crowns ? 'a' : 'b';
    return { n: i + 1, t: g.t, a: g.host, b: g.opp, w, three: Math.max(g.host.crowns, g.opp.crowns) === 3, low: lowestStanding(w === 'a' ? g.host : g.opp), deckA: deckKey(g.host.cards), deckB: deckKey(g.opp.cards) };
  });
  const n = games.length, wins = [0, 0], diff = [0];
  games.forEach((g) => { wins[g.w === 'a' ? 0 : 1]++; diff.push(wins[0] - wins[1]); });
  const best = [0, 0]; let run = 0;
  games.forEach((g, i) => { run = i && games[i - 1].w === g.w ? run + 1 : 1; const k = g.w === 'a' ? 0 : 1; best[k] = Math.max(best[k], run); });
  let current = 0; for (let i = n - 1; i >= 0 && games[i].w === games[n - 1].w; i--) current++;
  let leadChanges = 0, sign = 0;
  diff.slice(1).forEach((d) => { const s = Math.sign(d); if (s && sign && s !== sign) leadChanges++; if (s) sign = s; });

  const every = p.session.banEvery;
  const blocks = Math.max(1, Math.ceil(n / every), ...p.bans.map((b) => Math.ceil(b.fromGame / every)));
  const phases = [];
  for (let i = 0; i < blocks + (n > 0 && n % every === 0 ? 1 : 0); i++) {
    const from = i * every + 1, to = from + every - 1;
    const inPhase = games.filter((g) => g.n >= from && g.n <= to);
    phases.push({
      from, to,
      banA: p.bans.find((b) => b.fromGame === from && b.side === 'host')?.card ?? null,
      banB: p.bans.find((b) => b.fromGame === from && b.side === 'opponent')?.card ?? null,
      wins: [inPhase.filter((g) => g.w === 'a').length, inPhase.filter((g) => g.w === 'b').length],
      played: inPhase.length, upcoming: inPhase.length === 0,
    });
  }

  const decks = new Map();
  games.forEach((g) => {
    const seen = new Set();
    [['a', g.a.cards, g.deckA], ['b', g.b.cards, g.deckB]].forEach(([side, cards, key]) => {
      const d = decks.get(key) || { key, cards, games: 0, a: [0, 0], b: [0, 0] };
      d[side][g.w === side ? 0 : 1]++;
      if (!seen.has(key)) d.games++;
      seen.add(key); decks.set(key, d);
    });
  });
  const deckList = [...decks.values()].sort((x, y) => y.games - x.games || (y.a[0] + y.b[0]) - (x.a[0] + x.b[0]));
  const bestDeck = (k) => [...deckList].filter((d) => d[k][0] + d[k][1] > 0)
    .sort((x, y) => y[k][0] - x[k][0] || pct(y[k][0], y[k][1]) - pct(x[k][0], x[k][1]))[0] || null;
  const sideStats = (k) => {
    const mine = games.filter((g) => g.w === k);
    const lows = mine.map((g) => g.low).filter((v) => v !== null);
    return {
      wins: mine.length,
      three: mine.filter((g) => g.three).length,
      oneNil: mine.filter((g) => Math.max(g.a.crowns, g.b.crowns) === 1).length,
      best: best[k === 'a' ? 0 : 1],
      closest: lows.length ? Math.min(...lows) : null,
      damage: n ? games.reduce((s, g) => s + damageTo(k === 'a' ? g.b : g.a), 0) / n : 0,
      leaked: n ? games.reduce((s, g) => s + ((k === 'a' ? g.a : g.b).leaked || 0), 0) / n : 0,
      decks: new Set(games.map((g) => (k === 'a' ? g.deckA : g.deckB))).size,
      bestDeck: bestDeck(k),
    };
  };
  const lows = games.filter((g) => g.low !== null).sort((x, y) => x.low - y.low);
  return { games, n, wins, diff, current, leader: games[n - 1]?.w ?? null, leadChanges, phases, decks: deckList, A: sideStats('a'), B: sideStats('b'), clutch: lows[0] || null };
}

function header(p, a) {

function timeline(p, a) {
  const s = p.session, N = Math.max(a.n, 1);
  const cut = new Set(a.phases.filter((ph) => ph.from > 1 && !ph.upcoming).map((ph) => ph.from));
  const cells = (side) => a.games.map((g) => `<i class="${g.w === side ? `w ${side}${g.three ? ' big' : ''}` : ''}${cut.has(g.n) ? ' cut' : ''}" title="${g.n}: ${g.a.crowns}-${g.b.crowns}"></i>`).join('');
  const W = 1000, H = 70, mx = Math.max(3, ...a.diff.map(Math.abs));
  const X = (i) => (i - 0.5) * (W / N), Y = (v) => H / 2 - (v * (H / 2 - 4)) / mx;
  let path = `M0,${Y(0)}`;
  for (let i = 1; i <= a.n; i++) path += ` L${X(i)},${Y(a.diff[i])}`;
  const nums = a.games.map((g) => `<span>${g.n % 10 === 0 || g.n === 1 ? g.n : ''}</span>`).join('');
  return `<section class="panel">
    <h2>${T.timeline} <span>${T.perGame}</span></h2>
    <div class="tl-scroll" id="tlscroll"><div class="tl" style="--n:${N}">

      <div class="lead"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${T.legendLine}">
        <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="#2f343d" vector-effect="non-scaling-stroke"/>
        <path d="${path}" fill="none" stroke="#ecedf0" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg></div>
      <div class="who ca">${esc(s.host.name)}</div><div class="row">${cells('a')}</div>
      <div class="who cb">${esc(s.opponent.name)}</div><div class="row">${cells('b')}</div>
      <div class="pin"></div><div class="nums">${nums}</div>

  </section>`;
}

function veto(p, a) {
  const s = p.session, A = esc(s.host.name), B = esc(s.opponent.name);

    </li>`).join('')}</ul>

  </section>`;
}

function comparison(p, a) {
  const s = p.session, A = a.A, B = a.B;
  const row = (label, va, vb, fmt = (v) => v, lowerIsBetter = false) => {
    const tot = (va || 0) + (vb || 0);
    const wa = tot ? ((va || 0) / tot) * 100 : 0, wb = tot ? ((vb || 0) / tot) * 100 : 0;
    const aBetter = lowerIsBetter ? va < vb : va > vb, bBetter = lowerIsBetter ? vb < va : vb > va;
    return `<li><div class="l"><span>${aBetter ? `<b>${fmt(va)}</b>` : fmt(va)}</span><span>${label}</span><span>${bBetter ? `<b>${fmt(vb)}</b>` : fmt(vb)}</span></div>
      <div class="bars"><div class="${lowerIsBetter ? 'lo' : ''}"><i style="width:${wa}%"></i></div><div class="${lowerIsBetter ? 'lo' : ''}"><i style="width:${wb}%"></i></div></div></li>`;
  };
  const hp = (v) => (v === null ? '&ndash;' : `${v} HP`);
  return `<section class="panel">
    <h2>${T.h2h} <span><span class="ca">${esc(s.host.name)}</span> &middot; <span class="cb">${esc(s.opponent.name)}</span></span></h2>

      ${row(T.stats.oneNil, A.oneNil, B.oneNil)}
      ${row(T.stats.best, A.best, B.best)}
      ${row(T.stats.damage, A.damage, B.damage, (v) => num(v))}

    </ul>
    <div class="foot">${T.leadChanges(a.leadChanges)}</div>
  </section>`;
}

function gameRow(p, g, fresh) {

function feed(p, a, limit, withFilter) {

  const shown = limit ? list.slice(0, limit) : list;
  let html = '';
  shown.forEach((g) => {
    html += gameRow(p, g, g.n > seenGames && seenGames > 0);
    const ph = a.phases.find((x) => x.from === g.n && x.from > 1);
    if (ph && gameFilter === 'all') {
      const bans = [ph.banA && `${s.host.name}: ${ph.banA}`, ph.banB && `${s.opponent.name}: ${ph.banB}`].filter(Boolean).join(' · ');
      html += `<div class="phasebar">${T.phase(ph.from, ph.to)} &middot; ${esc(bans ? T.phaseBans(bans) : T.phaseNone)}</div>`;
    }
  });
  const filter = withFilter ? `<span>${[['all', T.all], ['a', s.host.name], ['b', s.opponent.name]].map(([k, l]) => `<button class="btn" data-filter="${k}" aria-pressed="${gameFilter === k}">${esc(l)}</button>`).join(' ')}</span>` : `<span>${T.newest}</span>`;
  return `<section class="panel">
    <h2>${withFilter ? T.everyGame : T.latest} ${filter}</h2>
    <div class="feed">${html || `<p class="empty">${T.firstGame}</p>`}</div>
    ${limit && a.n > limit ? `<button class="btn more" data-tab="games">${T.allGames}</button>` : ''}
  </section>`;
}

function deckTable(p, a) {
  const s = p.session;
  const rows = (allDecks ? a.decks : a.decks.slice(0, 15)).map((d) => {
    const rec = (r) => (r[0] + r[1] ? `${r[0]}&ndash;${r[1]}` : '<span class="na">&ndash;</span>');
    return `<tr><td>${deck8(d.cards)}</td><td>${d.games}</td><td class="ca">${rec(d.a)}</td><td class="cb">${rec(d.b)}</td><td>${pct(d.a[0] + d.b[0], d.a[1] + d.b[1])}%</td></tr>`;
  }).join('');
  return `<section class="panel">
    <h2>${T.tabs.decks} <span>${T.decksSub(a.decks.length)}</span></h2>
    <div class="tablewrap"><table class="dtable"><thead><tr><th>${T.colDeck}</th><th>${T.colGames}</th><th class="ca">${esc(s.host.name)}</th><th class="cb">${esc(s.opponent.name)}</th><th>${T.colRate}</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${a.decks.length > 15 ? `<button class="btn more" data-more="decks">${allDecks ? T.showLess : T.showAll(a.decks.length)}</button>` : ''}
  </section>`;
}

// ---------- recap artboard ----------
const FORMATS = { stream: { w: 1920, h: 1080 }, social: { w: 1080, h: 1350 } };
function artboard(p, a, fmt) {
  const s = p.session, { w, h } = FORMATS[fmt], wide = fmt === 'stream';
  const pad = wide ? 72 : 56;
  const winner = a.wins[0] >= s.target ? 'a' : a.wins[1] >= s.target ? 'b' : null;
  const done = s.status === 'finished' || winner;
  const lead = winner || (a.wins[0] === a.wins[1] ? null : a.wins[0] > a.wins[1] ? 'a' : 'b');
  const nameOf = (k) => esc(k === 'a' ? s.host.name : s.opponent.name);
  const verdict = done && lead ? `<div class="r-verdict">${T.winsSeries(`<b style="color:${lead === 'a' ? '#4b9bff' : '#ff5468'}">${nameOf(lead)}</b>`)}</div>` : '';

  // timeline rows
  const N = Math.max(a.n, 1), tlW = w - pad * 2 - (wide ? 150 : 120);
  const cellW = Math.max(4, Math.floor((tlW - (N - 1) * 3) / N));
  const cut = new Set(a.phases.filter((ph) => ph.from > 1 && !ph.upcoming).map((ph) => ph.from));
  const rowCells = (k) => a.games.map((g) => `<i class="${g.w === k ? k : ''}${cut.has(g.n) ? ' cut' : ''}" style="width:${cellW}px;height:${wide ? 30 : 26}px"></i>`).join('');
  const tl = `<div class="r-tl"><div class="r-label">${T.timeline}</div>
    <div style="display:grid;grid-template-columns:${wide ? 150 : 120}px auto;row-gap:6px;align-items:center">
      <div class="who" style="color:#4b9bff">${nameOf('a')}</div><div class="row" style="grid-template-columns:repeat(${N},${cellW}px)">${rowCells('a')}</div>
      <div class="who" style="color:#ff5468">${nameOf('b')}</div><div class="row" style="grid-template-columns:repeat(${N},${cellW}px)">${rowCells('b')}</div>
    </div></div>`;

  const banList = `<div><div class="r-label">${T.bans}</div>${a.phases.filter((ph) => !ph.upcoming || ph.banA || ph.banB).map((ph) => `
    <div class="r-ban"><div class="rng">${T.games(ph.from, ph.to)}</div>
      <div class="cards">${[ph.banA, ph.banB].some(Boolean) ? [ph.banA, ph.banB].map((c, i) => (c ? `<span class="x" style="--c:${i ? '#ff5468' : '#4b9bff'}">${corsImg(c, 0)}</span>` : '')).join('') : `<span class="none">${T.rNoBan}</span>`}</div>
      <div class="rec">${ph.played ? `<span style="color:#4b9bff">${ph.wins[0]}</span><span style="color:#5b606a">–</span><span style="color:#ff5468">${ph.wins[1]}</span>` : '–'}</div></div>`).join('')}</div>`;

  const c = a.clutch;
  const stats = `<div><div class="r-label">${T.rStats}</div><div class="r-stats">
    <div class="r-stat"><div class="v">${c ? c.low : '–'}<small>HP</small></div><div class="k">${T.rClosest}${c ? ` · <b style="color:${c.w === 'a' ? '#4b9bff' : '#ff5468'}">${nameOf(c.w)}</b>` : ''}</div></div>
    <div class="r-stat"><div class="v"><span style="color:#4b9bff">${a.A.best}</span><small>/</small> <span style="color:#ff5468">${a.B.best}</span></div><div class="k">${T.rStreak}</div></div>
    <div class="r-stat"><div class="v">${a.leadChanges}</div><div class="k">${T.rChanges}</div></div>
    <div class="r-stat"><div class="v"><span style="color:#4b9bff">${a.A.three}</span><small>/</small> <span style="color:#ff5468">${a.B.three}</span></div><div class="k">${T.rThree}</div></div>
  </div></div>`;

  const deckBlock = (k) => {
    const d = (k === 'a' ? a.A : a.B).bestDeck;
    if (!d) return '';
    const r = d[k];
    return `<div class="r-deck"><div class="who"><span style="font:700 24px Clash,sans-serif;color:${k === 'a' ? '#4b9bff' : '#ff5468'}">${nameOf(k)}</span><span>${T.rRecord(r[0], r[1])}</span></div>
      <div class="cards">${d.cards.map(([n, l]) => corsImg(n, l)).join('')}</div></div>`;
  };
  const decks = `<div><div class="r-label">${T.rBestDeck}</div>${deckBlock('a')}${deckBlock('b')}</div>`;

  const top = `<div class="r-top"><span>Best of ${s.target * 2 - 1} &middot; ${T.showmatch} &middot; ${day(s.startedAt)}</span><b>${done ? T.rFinal : `${T.live} &middot; ${T.rAfter(a.n)}`}</b></div>`;
  const score = `<div class="r-score"><div class="r-name" style="color:#4b9bff">${nameOf('a')}</div><div class="r-num">${a.wins[0]}<span>:</span>${a.wins[1]}</div><div class="r-name b" style="color:#ff5468">${nameOf('b')}</div></div>`;
  const foot = `<div class="r-foot"><span>${T.rData}</span><span>tojacob03.github.io/bo99</span></div>`;

  const body = wide
    ? `${top}${score}${verdict}${tl}<div class="r-cols" style="grid-template-columns:1fr 1.15fr 1.25fr">${banList}${stats}${decks}</div>${foot}`
    : `${top}<div class="r-score" style="grid-template-columns:1fr auto 1fr;gap:20px"><div class="r-name" style="color:#4b9bff;font-size:46px">${nameOf('a')}</div><div class="r-num" style="font-size:140px">${a.wins[0]}<span>:</span>${a.wins[1]}</div><div class="r-name b" style="color:#ff5468;font-size:46px">${nameOf('b')}</div></div>${verdict}${tl}<div class="r-cols" style="grid-template-columns:1fr 1fr">${stats}${banList}</div><div class="r-social-decks">${decks}</div>${foot}`;
  return `<div class="art${wide ? '' : ' social'}" id="art" style="width:${w}px;height:${h}px;padding:${pad}px;gap:${wide ? 34 : 26}px">${body}</div>`;
}

function recapPanel(p, a) {
  const { w, h } = FORMATS[recapFormat];
  return `<section class="panel">
    <h2>${T.recap} <span>${w} × ${h}</span></h2>
    <div class="rc-tools">
      ${[['stream', T.fmtStream], ['social', T.fmtSocial]].map(([k, l]) => `<button class="btn" data-format="${k}" aria-pressed="${recapFormat === k}">${l}</button>`).join('')}
      <button class="btn primary" id="dl">${T.download}</button>
      <span class="hint" id="dlmsg">${T.recapHint}</span>
    </div>
    <div class="rc-stage"><div class="rc-fit" id="rcfit">${artboard(p, a, recapFormat)}</div></div>
  </section>`;
}
function fitRecap() {
  const fit = document.getElementById('rcfit'), art = document.getElementById('art');
  if (!fit || !art) return;
  const { w, h } = FORMATS[recapFormat];
  const maxW = fit.parentElement.clientWidth - 32;
  const scale = Math.min(1, maxW / w, (recapFormat === 'social' ? 720 : 9999) / h);
  fit.style.width = `${w * scale}px`; fit.style.height = `${h * scale}px`;
  art.style.transform = `scale(${scale})`;
}
addEventListener('resize', fitRecap);

async function downloadRecap() {
  const art = document.getElementById('art'), btn = document.getElementById('dl'), msg = document.getElementById('dlmsg');
  if (!art || !window.htmlToImage) return;
  btn.disabled = true; msg.textContent = T.making;
  try {
    await document.fonts.ready;
    await Promise.all([...art.querySelectorAll('img')].map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
    const { w, h } = FORMATS[recapFormat];
    const url = await window.htmlToImage.toPng(art, { width: w, height: h, pixelRatio: 1, cacheBust: false, style: { transform: 'none' }, includeQueryParams: true, imagePlaceholder: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==' });
    const link = Object.assign(document.createElement('a'), { href: url, download: `bo99-${slug}-${recapFormat}.png` });
    document.body.appendChild(link); link.click(); link.remove();
    msg.textContent = T.recapHint;
  } catch (e) {
    console.error(e);
    msg.textContent = T.failed;
  }
  btn.disabled = false;
}

function render() {
  const p = payload, a = analyse(p);
  ICONS = p.icons || {};
  document.title = `${p.session.host.name} ${a.wins[0]}:${a.wins[1]} ${p.session.opponent.name} · Best of ${p.session.target * 2 - 1}`;
  if (!['overview', 'games', 'decks', 'recap'].includes(tab)) tab = 'overview';
  let body = '';
  if (tab === 'overview') body = `${timeline(p, a)}<div class="cols" style="margin-top:16px">${veto(p, a)}${comparison(p, a)}</div><div style="margin-top:16px">${feed(p, a, 6, false)}</div>`;
  else if (tab === 'games') body = feed(p, a, 0, true);
  else if (tab === 'decks') body = deckTable(p, a);
  else body = recapPanel(p, a);
  app.innerHTML = `${header(p, a)}${body}<footer>${T.footer}</footer>`;
  const sc = document.getElementById('tlscroll');
  if (sc) sc.scrollLeft = sc.scrollWidth;
  fitRecap();
  seenGames = a.n;
  updateAgo();
}

function updateAgo() {
  const el = document.getElementById('ago');
  if (!el || !payload) return;
  if (payload.session.status !== 'live') { el.textContent = ''; return; }
  const secs = Math.max(0, Math.round((Date.now() - lastFetch) / 1000));
  el.textContent = ` · ${secs < 5 ? T.justNow : T.ago(secs)}`;
}

app.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-filter],[data-more],[data-lang],[data-format],#dl');
  if (!t) return;
  if (t.id === 'dl') return downloadRecap();
  if (t.dataset.lang) return setLang(t.dataset.lang);
  if (t.dataset.tab) { tab = t.dataset.tab; history.replaceState(null, '', `${location.pathname}${location.search}#${tab}`); window.scrollTo({ top: 0 }); }
  if (t.dataset.filter) gameFilter = t.dataset.filter;
  if (t.dataset.more) allDecks = !allDecks;
  if (t.dataset.format) recapFormat = t.dataset.format;
  render();
});

app.addEventListener('submit', async (e) => {
  const form = e.target.closest('form.banedit');
  if (!form) return;
  e.preventDefault();
  const input = form.querySelector('input'), err = form.querySelector('.err'), btn = form.querySelector('button');
  const card = input.value.trim();
  if (card && !keyOf(card)) { err.textContent = T.pickCard; err.hidden = false; return; }
  btn.disabled = true; btn.textContent = T.saving; err.hidden = true;
  try {
    payload = await call({ action: 'ban_set', slug, modToken, fromGame: Number(form.dataset.from), side: form.dataset.side, card: card || null });
    lastFetch = Date.now();
    render();
  } catch (x) {
    btn.disabled = false; btn.textContent = T.save;
    err.textContent = x.status === 403 ? T.badLink : T.saveFail; err.hidden = false;
  }
});

async function loadSeries(first) {
  // never wipe a ban a mod is typing, and keep the recap still while it exports
  if (!first && document.activeElement && document.activeElement.closest('form.banedit')) return schedule();
  try {
    const next = await call({ action: 'session', slug });
    lastFetch = Date.now();
    const changed = !payload || next.games.length !== payload.games.length || JSON.stringify(next.bans) !== JSON.stringify(payload.bans) || next.session.status !== payload.session.status;
    payload = next;
    if (changed) render(); else updateAgo();
  } catch (x) {
    if (first) app.innerHTML = `<div class="crumbs"><a href="./">${T.allSeries}</a>${langSwitch()}</div><p class="empty">${x.status === 404 ? T.notFound : T.loadFail}</p>`;
  }
  schedule();
}
function schedule() {
  clearTimeout(timer);
  if (!payload || payload.session.status === 'live') timer = setTimeout(() => loadSeries(false), REFRESH_MS);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && payload && payload.session.status === 'live' && Date.now() - lastFetch > 5000) loadSeries(false); });

async function startSeries() {
  const fromUrl = params.get('mod');
  if (fromUrl) {
    try { localStorage.setItem(modKey(slug), fromUrl); } catch (_) { /* storage unavailable */ }
    params.delete('mod');
    history.replaceState(null, '', `${location.pathname}?${params}${location.hash}`);
  }
  let token = fromUrl;
  if (!token) { try { token = localStorage.getItem(modKey(slug)); } catch (_) { token = null; } }
  if (token) {
    try {
      if ((await call({ action: 'mod_check', slug, modToken: token })).ok) {
        modToken = token;
        document.getElementById('bo99-cards').innerHTML = Object.keys(window.BO99_CARDS || {}).sort().map((n) => `<option value="${esc(n)}">`).join('');
      }
    } catch (_) { /* not a mod */ }
  }
  setInterval(updateAgo, 1000);
  loadSeries(true);
}

let archive = null;
async function startArchive() {
  document.title = 'Best of 99';
  try {
    archive = archive || (await call({ action: 'sessions' })).sessions;
    app.innerHTML = `<div class="crumbs"><span>Best of 99 &middot; ${T.allSeries}</span>${langSwitch()}</div>
      <section class="panel"><h2>${T.allSeries} <span>${T.newest}</span></h2>
      ${archive.length ? '' : `<p class="empty">${T.noSeries}</p>`}
      <div class="list">${archive.map((s) => `<a href="?s=${encodeURIComponent(s.slug)}">
        <div><div class="t"><span class="ca">${esc(s.host_name)}</span> vs <span class="cb">${esc(s.opponent_name)}</span></div>
        <small>${day(s.started_at)} &middot; ${T.fromTime(time(s.started_at))}</small></div>
        <span class="live${s.status === 'live' ? '' : ' final'}"><i></i>${s.status === 'live' ? T.live : T.final}</span></a>`).join('')}</div></section>
      <footer>${T.footer}</footer>`;
  } catch (_) {
    app.innerHTML = `<p class="empty">${T.loadFail}</p>`;
  }
}

slug ? startSeries() : startArchive();
</script>
</body>
</html>
